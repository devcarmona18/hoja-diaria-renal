# Blueprint de Render: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: hoja-diaria-renal
    runtime: docker
    plan: free
    region: oregon
    branch: main
    autoDeploy: true            # cada push a main se despliega solo
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL       # se pega a mano desde Neon (no se versiona)
        sync: false
      - key: APP_USER
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: SECRET_KEY
        generateValue: true     # Render genera un valor aleatorio
      - key: DEMO_MODE
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: NEFROIA_URL        # R9: URL pública de NefroIA; vacío = «no configurado»
        sync: false
      - key: NEFROIA_SSO_SECRET # R9: mismo valor que en NefroIA (≥ 32 caracteres)
        sync: false
      - key: HL7_ENABLED        # integración HL7 AK 98 «Próximamente»: apagada
        value: "false"
      - key: HL7_BRIDGE_SECRET  # solo se usa si HL7_ENABLED=true
        sync: false
      - key: ARCHIVO_DIAS       # R13: días en «Archivados» (6 meses); luego se reactiva por cédula
        value: "180"
