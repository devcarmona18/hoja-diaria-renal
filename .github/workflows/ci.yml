name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, postgres]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: renal
          POSTGRES_PASSWORD: renal
          POSTGRES_DB: renal_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U renal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Tests
        env:
          TEST_DATABASE_URL: ${{ matrix.db == 'postgres' && 'postgresql://renal:renal@localhost:5432/renal_test' || '' }}
        run: python -m pytest -v

  docker:
    name: build Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir imagen
        run: docker build -t hoja-diaria-renal .
      - name: Probar arranque y /health
        run: |
          docker run -d --name app -p 8000:8000 -e DEMO_MODE=true hoja-diaria-renal
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/health && exit 0
            sleep 1
          done
          docker logs app
          exit 1
